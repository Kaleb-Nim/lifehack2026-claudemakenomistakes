<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Secure payment confirmation</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--tg-theme-text-color, #172234);
        background: var(--tg-theme-bg-color, #f4f7fb);
      }

      * { box-sizing: border-box; }

      body { margin: 0; min-height: 100vh; padding: 24px 18px; }

      main {
        max-width: 440px;
        margin: 0 auto;
        padding: 24px;
        border-radius: 24px;
        background: var(--tg-theme-secondary-bg-color, #ffffff);
        box-shadow: 0 18px 50px rgb(17 33 59 / 12%);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--tg-theme-hint-color, #68768a);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 { margin: 0; font-size: 27px; line-height: 1.15; }

      .summary {
        margin: 22px 0;
        padding: 18px;
        border: 1px solid rgb(127 145 171 / 24%);
        border-radius: 18px;
      }

      .row { display: flex; justify-content: space-between; gap: 20px; }
      .row + .row { margin-top: 12px; }
      .muted { color: var(--tg-theme-hint-color, #68768a); }
      .amount { font-size: 20px; font-weight: 750; }

      button {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 14px;
        padding: 13px 18px;
        color: var(--tg-theme-button-text-color, #ffffff);
        background: var(--tg-theme-button-color, #175cff);
        font: inherit;
        font-weight: 750;
      }

      button:disabled { opacity: 0.55; }
      #status { min-height: 42px; margin: 16px 2px 0; font-size: 14px; line-height: 1.45; }
      .fine-print { margin: 18px 2px 0; font-size: 12px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Visa secure confirmation</p>
      <h1>Confirm your payment</h1>

      <section class="summary" aria-label="Transaction summary">
        <div class="row"><span class="muted">Merchant</span><strong>Nova Electronics</strong></div>
        <div class="row"><span class="muted">Card</span><strong>Visa ···· 4242</strong></div>
        <div class="row"><span class="muted">Action</span><span id="confirmation" class="amount">Confirm payment</span></div>
      </section>

      <button id="authenticate" type="button">Confirm with device biometrics</button>
      <p id="status" class="muted" role="status">Checking biometric availability…</p>
      <p class="fine-print muted">
        Telegram performs local biometric authentication; no card details are exposed to
        the chat or AI.
      </p>
    </main>

    <script>
      const webApp = window.Telegram?.WebApp;
      const button = document.getElementById("authenticate");
      const status = document.getElementById("status");
      const confirmation = document.getElementById("confirmation");
      const label = new URLSearchParams(window.location.search).get("confirmation_label");

      if (label) confirmation.textContent = label;

      function setStatus(message, disabled = false) {
        status.textContent = message;
        button.disabled = disabled;
      }

      function completeAuthorization(method) {
        setStatus("Identity confirmed. Returning to Telegram…", true);
        webApp.HapticFeedback?.notificationOccurred("success");
        webApp.sendData(JSON.stringify({
          type: "biometric_confirmation",
          status: "authorized",
          method,
          confirmed_at: new Date().toISOString()
        }));
      }

      function authenticate(manager) {
        setStatus("Waiting for device authentication…", true);
        manager.authenticate(
          { reason: label || "Confirm this payment" },
          (authenticated) => {
            if (authenticated) completeAuthorization("telegram_biometric");
            else setStatus("Authentication was cancelled or failed. No payment was made.");
          }
        );
      }

      function provisionAndAuthenticate(manager) {
        const token = crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`;
        setStatus("Securely enabling biometrics for this bot…", true);
        manager.updateBiometricToken(token, (updated) => {
          if (updated) completeAuthorization("telegram_biometric_enrolment");
          else setStatus("Biometric setup was cancelled or failed. No payment was made.");
        });
      }

      function requestAuthentication() {
        const manager = webApp?.BiometricManager;
        if (!manager?.isInited || !manager.isBiometricAvailable) {
          setStatus("Device biometrics are unavailable in this Telegram client.", true);
          return;
        }

        const proceed = () => {
          if (manager.isBiometricTokenSaved) authenticate(manager);
          else provisionAndAuthenticate(manager);
        };

        if (manager.isAccessGranted) proceed();
        else {
          setStatus("Telegram needs permission to use device biometrics…", true);
          manager.requestAccess(
            { reason: "Confirm payments without exposing card details" },
            (granted) => {
              if (granted) proceed();
              else setStatus("Biometric permission was not granted. No payment was made.");
            }
          );
        }
      }

      if (!webApp) {
        setStatus("Open this page from the Telegram payment button.", true);
      } else if (!webApp.isVersionAtLeast("7.2")) {
        setStatus("Update Telegram to use biometric confirmation.", true);
      } else {
        webApp.ready();
        webApp.expand();
        webApp.BiometricManager.init(() => {
          const type = webApp.BiometricManager.biometricType;
          button.textContent = type === "face" ? "Confirm with Face ID" : "Confirm with biometrics";
          setStatus(
            webApp.BiometricManager.isBiometricAvailable
              ? "Your biometric data stays on this device."
              : "Device biometrics are unavailable in this Telegram client.",
            !webApp.BiometricManager.isBiometricAvailable
          );
        });
        button.addEventListener("click", requestAuthentication);
      }
    </script>
  </body>
</html>
